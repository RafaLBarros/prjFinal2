appId: com.rafael.echotabula
productName: Echo Tabula
artifactName: Echo-Tabula-Setup-${version}.${ext}
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**

# CONFIGURAÇÃO DO INSTALADOR (NSIS)
win:
  executableName: EchoTabula
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: true 
  perMachine: false 
  allowToChangeInstallationDirectory: false
  shortcutName: Echo Tabula

npmRebuild: false

# A BÚSSOLA DO GITHUB
publish:
  provider: github
  owner: RafaLBarros
  repo: prjFinal2

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/